# Repeatable, isolated local counterpart of the OpenReview PR preview.
# Run with: docker compose --env-file .env.bibe-local -f docker-compose.bibe-local.yml up -d --build
name: openreview-bibe-local

services:
  # Optional, loopback-only image registry for the pre-built-image exercise.
  registry:
    profiles: [registry]
    image: registry:2.8.3
    ports:
      - "127.0.0.1:5005:5000"
    volumes:
      - registry-data:/var/lib/registry
    mem_limit: 256m

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openreview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.bibe-local}
      POSTGRES_DB: openreview
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreview -d openreview"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 320m

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.bibe-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.bibe-local}
    volumes:
      - minio-data:/data
    mem_limit: 768m

  create-buckets:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.bibe-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.bibe-local}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 2
        done
        mc mb --ignore-existing local/originals local/proxies
    restart: "no"

  migrate:
    image: ${BIBE_API_IMAGE:-openreview-bibe-local-api:dev}
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://openreview:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.bibe-local}@postgres:5432/openreview?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.bibe-local}
      ALLOW_DEMO_SEED: "true"
    command:
      - /bin/sh
      - -ec
      - ./packages/db/node_modules/.bin/prisma migrate deploy --schema packages/db/prisma/schema.prisma && ./packages/db/node_modules/.bin/tsx packages/db/prisma/seed.ts
    restart: "no"

  api:
    image: ${BIBE_API_IMAGE:-openreview-bibe-local-api:dev}
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      DATABASE_URL: postgresql://openreview:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.bibe-local}@postgres:5432/openreview?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.bibe-local}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:${BIBE_LOCAL_PORT:-8088}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.bibe-local}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.bibe-local}
      S3_BUCKET_ORIGINALS: originals
      S3_BUCKET_PROXIES: proxies
      S3_FORCE_PATH_STYLE: "true"
      WEB_URL: http://127.0.0.1:${BIBE_LOCAL_PORT:-8088}
      CORS_ORIGINS: http://127.0.0.1:${BIBE_LOCAL_PORT:-8088}
      METRICS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 768m

  worker:
    image: ${BIBE_WORKER_IMAGE:-openreview-bibe-local-worker:dev}
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://openreview:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.bibe-local}@postgres:5432/openreview?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.bibe-local}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.bibe-local}
      S3_BUCKET_ORIGINALS: originals
      S3_BUCKET_PROXIES: proxies
      S3_FORCE_PATH_STYLE: "true"
      WORKER_CONCURRENCY: "1"
    mem_limit: 2g

  web:
    image: ${BIBE_WEB_IMAGE:-openreview-bibe-local-web:dev}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_URL: http://api:4000
    mem_limit: 768m

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - api
      - minio
    ports:
      - "127.0.0.1:${BIBE_LOCAL_PORT:-8088}:8080"
    volumes:
      - ./deploy/bibe-local.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m

volumes:
  registry-data:
  postgres-data:
  redis-data:
  minio-data:
