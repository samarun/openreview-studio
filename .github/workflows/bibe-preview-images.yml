name: Build BIBE preview images

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read
  packages: write

concurrency:
  group: openreview-bibe-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  publish-preview-images:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'bibe-preview')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            dockerfile: Dockerfile.web
            image: openreview-studio-web
          - component: api
            dockerfile: Dockerfile.api
            image: openreview-studio-api
          - component: worker
            dockerfile: Dockerfile.worker
            image: openreview-studio-worker
    steps:
      - name: Check out the exact pull-request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the exact PR ${{ matrix.component }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/samarun/${{ matrix.image }}:sha-${{ github.event.pull_request.head.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://openreview-pr-${{ github.event.pull_request.number }}.git.arunsamuel.com/api
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.title=OpenReview Studio ${{ matrix.component }} PR preview
