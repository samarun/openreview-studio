name: Build BIBE preview images

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read
  packages: write

concurrency:
  group: openreview-bibe-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  publish-preview-images:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'bibe-preview')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            dockerfile: Dockerfile.web
            image: openreview-studio-web
          - component: api
            dockerfile: Dockerfile.api
            image: openreview-studio-api
          - component: worker
            dockerfile: Dockerfile.worker
            image: openreview-studio-worker
    steps:
      - name: Check out the exact pull-request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the exact PR ${{ matrix.component }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/samarun/${{ matrix.image }}:sha-${{ github.event.pull_request.head.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.title=OpenReview Studio ${{ matrix.component }} PR preview

  preview-route-check:
    name: Preview HTTPS and API reachable
    needs: publish-preview-images
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'bibe-preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait for authenticated web route and healthy same-origin API
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          host="openreview-pr-${PR_NUMBER}.git.arunsamuel.com"
          for attempt in $(seq 1 60); do
            web_status=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' "https://${host}/" || true)
            api_status=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' "https://${host}/api/health/ready" || true)
            if [[ "$web_status" == "401" && "$api_status" == "200" ]]; then
              echo "Preview web authentication and API readiness are reachable over verified HTTPS."
              echo "URL: https://${host}/"
              exit 0
            fi
            echo "Attempt ${attempt}: web=${web_status}, api=${api_status}; waiting for reconciliation"
            sleep 10
          done
          echo "Preview route did not become reachable: https://${host}/" >&2
          exit 1
